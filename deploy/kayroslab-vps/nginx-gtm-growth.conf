server {
  listen 80;
  listen [::]:80;
  server_name gtm.kayroslab.com;

  # Certbot adds the HTTPS server block from this initial virtual host.
  root /opt/gtm-growth/site;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /health {
    proxy_pass http://127.0.0.1:4300/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Authenticated MCP endpoints remain available to approved clients only.
  location ~ ^/(mcp|sse|messages)$ {
    proxy_pass http://127.0.0.1:4300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
