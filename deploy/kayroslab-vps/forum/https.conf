map $http_upgrade $gtmgrowth_forum_connection {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name forum.gtmgrowth.kayroslab.com;
    ssl_certificate /etc/letsencrypt/live/forum.gtmgrowth.kayroslab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.gtmgrowth.kayroslab.com/privkey.pem;
    client_max_body_size 10m;

    location / {
        proxy_pass http://unix:/var/discourse/shared/gtmgrowth-forum/nginx.http.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gtmgrowth_forum_connection;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
