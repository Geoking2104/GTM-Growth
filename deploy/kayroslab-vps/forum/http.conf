# Managed by the GTM Growth forum installer.
server {
    listen 80;
    listen [::]:80;
    server_name forum.gtmgrowth.kayroslab.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gtmgrowth-forum-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://forum.gtmgrowth.kayroslab.com$request_uri;
    }
}
