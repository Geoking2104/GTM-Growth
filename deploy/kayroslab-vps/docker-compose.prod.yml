services:
  gtm-growth:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_EDGE_IP: "true"
      AUDIT_JOBS_ENABLED: ${AUDIT_JOBS_ENABLED:-true}
      AUDIT_DATABASE_URL: postgres://gtm_audits:${AUDIT_DB_PASSWORD:?Audit database password required}@audit-db:5432/gtm_audits
      AUDIT_REDIS_URL: redis://audit-redis:6379
      AUDIT_JOBS_SECRET: ${AUDIT_JOBS_SECRET:?Audit signing secret required}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      REDIS_URL: redis://redis:6379
      LEADS_PATH: /data/leads.jsonl
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/service-account.json
      # Console SSO: tokens issued by the Keycloak realm below (validated via JWKS).
      OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.kayroslab.com/realms/gtm-growth}
      OIDC_CLIENT_ID: gtm-console
      # JWKS fetched on the internal network, issuer still checked against the public URL.
      OIDC_JWKS_URL: http://keycloak:8080/realms/gtm-growth/protocol/openid-connect/certs
      # Multi-tenant: dedicated client realms are trusted from the tenant registry;
      # their JWKS are fetched through the internal Keycloak URL.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      OIDC_EXTRA_ISSUERS: ${OIDC_EXTRA_ISSUERS:-}
      TENANTS_PATH: /data/tenants.json
      MCP_RESOURCE: ${MCP_RESOURCE:-https://gtm.kayroslab.com/mcp}
      MCP_PUBLIC_ORIGIN: ${MCP_PUBLIC_ORIGIN:-https://gtm.kayroslab.com}
      MCP_STATIC_TOKEN_ENABLED: ${MCP_STATIC_TOKEN_ENABLED:-true}
      REPORTS_PATH: /data/reports
      # Public report email-code gate. The persisted secret is generated once
      # by deploy.sh; SMTP must be configured separately before enabling.
      REPORT_ACCESS_ENABLED: ${REPORT_ACCESS_ENABLED:-false}
      REPORT_ACCESS_SECRET: ${REPORT_ACCESS_SECRET:-}
      REPORT_ACCESS_DB_PATH: /data/report-access.sqlite3
      AI_TRACKER_DB_PATH: ${AI_TRACKER_DB_PATH:-/data/ai-tracker.sqlite3}
      REPORT_PUBLIC_ORIGIN: ${REPORT_PUBLIC_ORIGIN:-https://gtm.kayroslab.com}
      PAP_ENABLED: ${PAP_ENABLED:-false}
      PAP_PUBLIC_ORIGIN: ${PAP_PUBLIC_ORIGIN:-https://gtm.kayroslab.com}
      PAP_ALLOWED_CLIENTS: ${PAP_ALLOWED_CLIENTS:-}
      PAP_DB_PATH: /data/poppy.sqlite3
      PAP_MEMBERSHIP_AUTH_REALM: ${PAP_MEMBERSHIP_AUTH_REALM:-gtm-growth}
      PAP_MEMBERSHIP_CLIENT_ID: ${PAP_MEMBERSHIP_CLIENT_ID:-}
      PAP_MEMBERSHIP_CLIENT_SECRET: ${PAP_MEMBERSHIP_CLIENT_SECRET:-}
      CONSOLE_DOMAIN: gtm.kayroslab.com
      # Tenant provisioning (service account, secret only in .env.local).
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-gtm-growth}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-gtm-provisioner}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
    volumes:
      - gtm_growth_data:/data
      # Optional Google service-account file; never commit it to the repository.
      - /opt/gtm-growth/.secrets:/secrets:ro
    ports:
      # The API is deliberately private; Nginx is its only public entry point.
      - "127.0.0.1:4300:3000"
    depends_on:
      redis:
        condition: service_healthy
      audit-db:
        condition: service_healthy
      audit-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - gtm_growth_redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Durable audit ledger, isolated from Keycloak and the evictable response cache.
  audit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gtm_audits
      POSTGRES_USER: gtm_audits
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?Audit database password required}
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=64MB"]
    volumes:
      - gtm_growth_audit_db:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm_audits -d gtm_audits"]
      interval: 10s
      timeout: 3s
      retries: 5

  audit-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - gtm_growth_audit_redis:/data
    mem_limit: 192m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  audit-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["node", "dist/audit-jobs/worker.js"]
    environment:
      NODE_ENV: production
      AUDIT_JOBS_ENABLED: "true"
      AUDIT_DATABASE_URL: postgres://gtm_audits:${AUDIT_DB_PASSWORD:?Audit database password required}@audit-db:5432/gtm_audits
      AUDIT_REDIS_URL: redis://audit-redis:6379
      AUDIT_JOBS_SECRET: ${AUDIT_JOBS_SECRET:?Audit signing secret required}
    depends_on:
      audit-db:
        condition: service_healthy
      audit-redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 180s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Keycloak (SSO de la console) — mode production, base Postgres ──
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    labels:
      com.kayroslab.gtm.theme-revision: ${GTM_THEME_REVISION:-manual}
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD manquant dans .env.local}
      KC_HOSTNAME: ${KC_HOSTNAME:-https://auth.kayroslab.com}
      # Console d'administration accessible uniquement via tunnel SSH (ssh -L 8180:127.0.0.1:8180).
      KC_HOSTNAME_ADMIN: ${KC_HOSTNAME_ADMIN:-http://localhost:8180}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD manquant dans .env.local}
      KC_FEATURES: organization
    volumes:
      - ./keycloak/realm-gtm-growth.json:/opt/keycloak/data/import/realm-gtm-growth.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      # Public only through Nginx (auth.kayroslab.com).
      - "127.0.0.1:8180:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD manquant dans .env.local}
    volumes:
      - gtm_growth_keycloak_db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Optionnel : modèle open source auto-hébergé pour les générateurs ──
  # docker compose --profile llm up -d ollama && docker compose exec ollama ollama pull mistral
  # puis OLLAMA_URL=http://ollama:11434 dans .env.local
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - gtm_growth_ollama:/root/.ollama
    restart: unless-stopped

volumes:
  gtm_growth_audit_db:
  gtm_growth_audit_redis:
  gtm_growth_ollama:
  gtm_growth_keycloak_db:
  gtm_growth_data:
  gtm_growth_redis:
