# auth.kayroslab.com → Keycloak (127.0.0.1:8180). Certbot ajoute le bloc HTTPS :
#   certbot --nginx -d auth.kayroslab.com --redirect --agree-tos -m contact@kayroslab.com
server {
  listen 80;
  listen [::]:80;
  server_name auth.kayroslab.com;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Seuls les chemins publics de Keycloak sont exposés (pas /metrics ni /health).
  location ~ ^/(realms|resources|js)/ {
    proxy_pass http://127.0.0.1:8180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
  }

  # Console d'administration : à restreindre (IP de confiance) ou passer par un tunnel SSH.
  location /admin/ {
    # allow 203.0.113.10;  # ← votre IP
    # deny all;
    proxy_pass http://127.0.0.1:8180;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  location = / { return 302 /realms/gtm-growth/account/; }
  location / { return 404; }
}
