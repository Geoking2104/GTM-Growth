passwordResetSubject=Reset your GTM Growth password
passwordResetBody=Hello,\n\nA password reset was requested for your GTM Growth account.\nOpen this link (valid for a few minutes):\n{0}\n\nIf you did not request this, you can ignore this email.\n\n— The GTM Growth · KayrosLab team
passwordResetBodyHtml=<div style="font-family:Inter,Segoe UI,system-ui,sans-serif;max-width:560px;margin:0 auto;color:#1f2430"><div style="background:#070d18;padding:20px 24px;border-radius:14px 14px 0 0"><strong style="color:#eaf2fb;font-size:16px">GTM Growth</strong><div style="color:#8ea3bf;font-size:12px;margin-top:4px">KayrosLab</div></div><div style="border:1px solid #e9e9ee;border-top:0;padding:24px;border-radius:0 0 14px 14px;background:#fff"><p style="margin:0 0 12px">Hello,</p><p style="margin:0 0 16px">A password reset was requested for your <strong>GTM Growth</strong> account.</p><p style="margin:0 0 20px"><a href="{0}" style="display:inline-block;background:#2563eb;color:#fff;text-decoration:none;font-weight:650;padding:12px 18px;border-radius:999px">Choose a new password</a></p><p style="margin:0;color:#6f7684;font-size:13px">If the button does not work, copy this link:<br/><a href="{0}" style="color:#2563eb;word-break:break-all">{0}</a></p><p style="margin:20px 0 0;color:#6f7684;font-size:13px">If you did not request this, ignore this email.</p></div></div>

