passwordResetSubject=Réinitialiser votre mot de passe GTM Growth
passwordResetBody=Bonjour,\n\nUne demande de réinitialisation de mot de passe a été faite pour votre compte GTM Growth.\nCliquez sur le lien ci-dessous (valable quelques minutes) :\n{0}\n\nSi vous n''êtes pas à l''origine de cette demande, ignorez cet e-mail.\n\n— L''équipe GTM Growth · KayrosLab
passwordResetBodyHtml=<div style="font-family:Inter,Segoe UI,system-ui,sans-serif;max-width:560px;margin:0 auto;color:#1f2430"><div style="background:#070d18;padding:20px 24px;border-radius:14px 14px 0 0"><img src="" alt="" width="0" height="0" style="display:none"/><strong style="color:#eaf2fb;font-size:16px">GTM Growth</strong><div style="color:#8ea3bf;font-size:12px;margin-top:4px">KayrosLab</div></div><div style="border:1px solid #e9e9ee;border-top:0;padding:24px;border-radius:0 0 14px 14px;background:#fff"><p style="margin:0 0 12px">Bonjour,</p><p style="margin:0 0 16px">Une demande de réinitialisation de mot de passe a été faite pour votre compte <strong>GTM Growth</strong>.</p><p style="margin:0 0 20px"><a href="{0}" style="display:inline-block;background:#2563eb;color:#fff;text-decoration:none;font-weight:650;padding:12px 18px;border-radius:999px">Choisir un nouveau mot de passe</a></p><p style="margin:0;color:#6f7684;font-size:13px">Si le bouton ne fonctionne pas, copiez ce lien :<br/><a href="{0}" style="color:#2563eb;word-break:break-all">{0}</a></p><p style="margin:20px 0 0;color:#6f7684;font-size:13px">Si vous n''êtes pas à l''origine de cette demande, ignorez cet e-mail.</p></div></div>

