# Native AI tracker — local infrastructure (Docker Compose)
# Chromium lives in the worker image, not as a separate service.
services:
  app:
    build: ../..
    environment:
      - AI_TRACKER_ENABLED=false

  ai-worker:
    build: ../..
    command: ["pnpm", "ai-tracker:worker"]
    environment:
      - AI_TRACKER_ENABLED=true
      - AI_TRACKER_TENANT_ID=${AI_TRACKER_TENANT_ID:?set the tenant id}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
      - AI_TRACKER_SCRAPER_SESSION_DIR=/data/ai-tracker-sessions
      - AI_TRACKER_CHROMIUM_PATH=/usr/bin/chromium
    volumes:
      - tracker_data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  ollama_data:
  tracker_data:
