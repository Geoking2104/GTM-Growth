<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">Tableau de bord GTM Growth illustratif pour opendpe.net</title>
  <desc id="desc">Score GEO 71 sur 100, citabilité IA 53 sur 100, préparation IndexNow 35 sur 100. La courbe est une projection, pas un historique.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="plot" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#a78bfa" stop-opacity=".33"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="18" flood-color="#17203d" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1400" height="880" rx="25" fill="#f6f7fb"/>
  <rect width="250" height="880" rx="25" fill="#0d0d1f"/>
  <rect x="225" y="0" width="25" height="880" fill="#0d0d1f"/>
  <circle cx="44" cy="47" r="17" fill="url(#accent)"/>
  <path d="M39 55L51 39M40 44l9-4-2 10" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="74" y="53" font-size="21" font-weight="760" fill="#faf9ff">GTM Growth</text>
    <rect x="18" y="105" width="214" height="42" rx="11" fill="#262044"/>
    <circle cx="43" cy="126" r="7" fill="#a78bfa"/>
    <text x="59" y="133" font-size="17" font-weight="630" fill="#eee7ff">Vue d’ensemble</text>
    <g font-size="17" fill="#a9a8c3">
      <text x="39" y="194">Audit GEO</text><text x="39" y="242">Citabilité</text>
      <text x="39" y="290">Recherche</text><text x="39" y="338">IndexNow</text>
      <text x="39" y="386">Suivi</text><text x="39" y="434">Plan d’action</text>
    </g>
    <rect x="268" y="19" width="1114" height="72" rx="14" fill="white"/>
    <text x="303" y="64" font-size="26" font-weight="750" fill="#151a2a">Vue d’ensemble</text>
    <rect x="1125" y="35" width="230" height="40" rx="20" fill="#f3eeff"/>
    <text x="1240" y="61" text-anchor="middle" font-size="16" font-weight="650" fill="#6d28d9">opendpe.net</text>
    <text x="290" y="137" font-size="26" font-weight="730" fill="#151a2a">Votre visibilité en un coup d’œil</text>
    <text x="291" y="164" font-size="16" fill="#5d6577">Exemple d’audit public · données mesurées et améliorations projetées</text>
    <g filter="url(#shadow)">
      <rect x="286" y="188" width="340" height="166" rx="17" fill="white"/>
      <rect x="648" y="188" width="340" height="166" rx="17" fill="white"/>
      <rect x="1010" y="188" width="342" height="166" rx="17" fill="white"/>
    </g>
    <g font-size="16" font-weight="620" fill="#5d6577"><text x="314" y="226">Score GEO</text><text x="677" y="226">Citabilité IA</text><text x="1039" y="226">Préparation IndexNow</text></g>
    <text x="314" y="291" font-size="60" font-weight="810" fill="#5224aa">71<tspan fill="#9aa2b2" font-size="22">/100</tspan></text>
    <text x="677" y="291" font-size="60" font-weight="810" fill="#c02688">53<tspan fill="#9aa2b2" font-size="22">/100</tspan></text>
    <text x="1039" y="291" font-size="60" font-weight="810" fill="#d97706">35<tspan fill="#9aa2b2" font-size="22">/100</tspan></text>
