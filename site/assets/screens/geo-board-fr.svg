    <text x="321" y="449" font-size="15" fill="#667085">Progression illustrative après les correctifs prioritaires</text>
    <g stroke="#e8e9f0" stroke-width="1">
      <line x1="354" y1="512" x2="1310" y2="512"/><line x1="354" y1="577" x2="1310" y2="577"/><line x1="354" y1="642" x2="1310" y2="642"/>
      <line x1="354" y1="707" x2="1310" y2="707"/>
    </g>
    <g fill="#9198aa" font-size="15" text-anchor="end"><text x="339" y="517">100</text><text x="339" y="582">90</text><text x="339" y="647">80</text><text x="339" y="712">70</text></g>
    <path d="M380 697L500 675L630 640L758 610L885 576L1014 546L1150 522L1290 512L1290 707L380 707Z" fill="url(#plot)"/>
    <path d="M380 697L500 675L630 640L758 610L885 576L1014 546L1150 522L1290 512" stroke="url(#accent)" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="white" stroke="#7c3aed" stroke-width="3.2"><circle cx="380" cy="697" r="7"/><circle cx="630" cy="640" r="7"/><circle cx="885" cy="576" r="7"/><circle cx="1150" cy="522" r="7"/><circle cx="1290" cy="512" r="8"/></g>
    <g font-size="15" fill="#646b7e" text-anchor="middle"><text x="385" y="734">Aujourd’hui</text><text x="630" y="734">Action 4</text><text x="885" y="734">Action 8</text><text x="1150" y="734">Action 13</text><text x="1290" y="734">Action 16</text></g>
    <rect x="286" y="776" width="1066" height="70" rx="14" fill="#f0e9ff"/>
    <text x="316" y="806" font-size="18" font-weight="740" fill="#5b21b6">71 → 100 : score GEO potentiel</text>
    <text x="316" y="829" font-size="14" fill="#6d607e">Illustration en français · projection, pas un historique de résultats</text>
  </g>
