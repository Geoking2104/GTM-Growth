name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install · Typecheck · Lint · Test · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI help (smoke)
        run: node dist/cli.js help

      - name: CLI smoke — GEO engine
        run: node scripts/smoke-geo.mjs

      - name: Landing site check
        run: node scripts/check-site.mjs

      - name: Build production image
        run: docker build -t gtm-growth-ci .

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  landing-visual-qa:
    name: Landing · FR/EN browser QA and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Check French and English journeys
        env:
          LANDING_QA_OUTPUT_DIR: qa-landing
        run: node scripts/qa-landing.mjs

      - name: Upload bilingual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-fr-en-screenshots
          path: qa-landing/
          if-no-files-found: warn
          retention-days: 14

      - name: Check data assistant in French and English
        env:
          DATA_AGENT_QA_OUTPUT_DIR: qa-data-agent
        run: node scripts/qa-data-agent.mjs

      - name: Upload data assistant screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-agent-fr-en-screenshots
          path: qa-data-agent/
          if-no-files-found: warn
          retention-days: 14

  local-seo-flows:
    name: Local SEO · Node-RED runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned optional runtime
        run: npm install --prefix /tmp/gtm-node-red --ignore-scripts --no-audit --no-fund node-red@4.1.17
      - name: Execute exported pollers against a local fixture
        env:
          NODE_RED_ENTRY: /tmp/gtm-node-red/node_modules/node-red/red.js
        run: node scripts/qa-local-seo-flows.mjs
