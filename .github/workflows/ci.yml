name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install · Typecheck · Lint · Test · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI help (smoke)
        run: node dist/cli.js help

      - name: CLI smoke — GEO engine
        run: node scripts/smoke-geo.mjs

      - name: Landing site check
        run: node scripts/check-site.mjs

      - name: Build production image
        run: docker build -t gtm-growth-ci .

      - name: Validate isolated GEO renderer Compose (no deployment)
        env:
          GEO_TENANT_ID: ci-smoke
          GEO_URL: https://example.com/
          GEO_TARGET_HOSTNAME: example.com
          GEO_DATA_VOLUME_NAME: fake-volume-ci
        run: docker compose -f deploy/geo-renderer/docker-compose.yml config --quiet

      - name: Build isolated GEO renderer image (no deployment)
        run: docker build -f deploy/geo-renderer/Dockerfile -t gtm-geo-renderer-ci .

      - name: Chromium sandboxed offline smoke in isolated container (no deployment)
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,size=256m --shm-size 256m
          --security-opt seccomp=deploy/geo-renderer/seccomp_profile.json
          -e HOME=/tmp --cap-drop ALL --security-opt=no-new-privileges
          gtm-geo-renderer-ci node --input-type=module -e
          'import { chromium } from "playwright-core"; const b = await chromium.launch({ headless: true, chromiumSandbox: true }); try { const p = await b.newPage(); await p.setContent("<title>GEO smoke</title><h1>OK</h1>"); if (await p.title() !== "GEO smoke") process.exitCode = 1; } finally { await b.close(); }'

      - name: Assert GEO internal Docker bridge blocks direct host and internet egress
        run: bash scripts/smoke-geo-network-boundary.sh

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
