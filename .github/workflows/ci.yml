name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-pipeline:
    name: Audit · PostgreSQL and Redis recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gtm_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: gtm_audit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gtm_test -d gtm_audit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/audit-jobs.test.ts tests/visibility-jobs.test.ts
        env:
          TEST_AUDIT_DATABASE_URL: postgres://gtm_test:fixture-only-password@127.0.0.1:5432/gtm_audit_test
          TEST_AUDIT_REDIS_URL: redis://127.0.0.1:6379

  build:
    name: Install · Typecheck · Lint · Test · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Documentation links
        run: pnpm run docs:check

      - name: Verify pinned JointJS browser assets
        run: pnpm run vendor:check

      - name: Release readiness
        run: pnpm run release:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: CLI help (smoke)
        run: node dist/cli.js help

      - name: CLI smoke — GEO engine
        run: node scripts/smoke-geo.mjs

      - name: Pack and install the public CLI
        run: node scripts/smoke-package.mjs

      - name: Landing site check
        run: node scripts/check-site.mjs

      - name: Build production image
        run: docker build -t gtm-growth-ci .

      - name: Validate isolated GEO renderer Compose (no deployment)
        env:
          GEO_TENANT_ID: ci-smoke
          GEO_URL: https://example.com/
          GEO_TARGET_HOSTNAME: example.com
          GEO_DATA_VOLUME_NAME: fake-volume-ci
        run: docker compose -f deploy/geo-renderer/docker-compose.yml config --quiet

      - name: Build isolated GEO renderer image (no deployment)
        run: docker build -f deploy/geo-renderer/Dockerfile -t gtm-geo-renderer-ci .

      - name: Chromium sandboxed offline smoke in isolated container (no deployment)
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,size=256m --shm-size 256m
          --security-opt seccomp=deploy/geo-renderer/seccomp_profile.json
          -e HOME=/tmp --cap-drop ALL --security-opt=no-new-privileges
          gtm-geo-renderer-ci node --input-type=module -e
          'import { chromium } from "playwright-core"; const b = await chromium.launch({ headless: true, chromiumSandbox: true }); try { const p = await b.newPage(); await p.setContent("<title>GEO smoke</title><h1>OK</h1>"); if (await p.title() !== "GEO smoke") process.exitCode = 1; } finally { await b.close(); }'

      - name: Assert GEO internal Docker bridge blocks direct host and internet egress
        run: bash scripts/smoke-geo-network-boundary.sh

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  landing-visual-qa:
    name: Landing · FR/EN browser QA and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install landing test browsers
        run: pnpm exec playwright-core install --with-deps chromium firefox webkit

      - name: Check French and English journeys
        env:
          LANDING_CROSS_BROWSER: "1"
          LANDING_QA_OUTPUT_DIR: qa-landing
        run: node scripts/qa-landing.mjs

      - name: Google Business Profile dashboard QA
        env:
          LANDING_QA_OUTPUT_DIR: qa-landing
        run: node scripts/qa-gbp-dashboard.mjs

      - name: Social console browser QA
        env:
          SOCIAL_QA_OUTPUT_DIR: qa-landing/social
        run: node scripts/qa-social.mjs

      - name: Campaign Studio strict-CSP FR/EN browser QA
        env:
          SCENARIOS_QA_OUTPUT_DIR: qa-landing/scenarios
        run: pnpm run qa:scenarios

      - name: CRM console and global journey browser QA
        env:
          CRM_QA_OUTPUT_DIR: qa-landing/crm
        run: node scripts/qa-crm.mjs

      - name: Upload bilingual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-fr-en-screenshots
          path: qa-landing/
          if-no-files-found: warn
          retention-days: 14

      - name: Check data assistant in French and English
        env:
          DATA_AGENT_QA_OUTPUT_DIR: qa-data-agent
        run: node scripts/qa-data-agent.mjs

      - name: Upload data assistant screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-agent-fr-en-screenshots
          path: qa-data-agent/
          if-no-files-found: warn
          retention-days: 14

  brand-browser:
    name: Brand · Keycloak 26.4 and dashboard FR/EN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: Console coach, contextual help and live status FR/EN
        env:
          CONSOLE_COACH_QA_OUTPUT_DIR: qa-brand/coach
        run: pnpm run qa:console-coach
      - run: node scripts/qa-brand.mjs
      - run: node scripts/qa-decision-console.mjs
      - run: node scripts/qa-decision-workflows.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-fr-en-screenshots
          path: qa-brand/
          retention-days: 14

  local-seo-flows:
    name: Local SEO · Node-RED runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned optional runtime
        run: |
          mkdir -p /tmp/gtm-node-red
          printf '%s\n' '{"name":"gtm-node-red-smoke","private":true}' > /tmp/gtm-node-red/package.json
          pnpm --dir /tmp/gtm-node-red add --ignore-scripts --save-exact node-red@4.1.17
      - name: Execute exported pollers against a local fixture
        env:
          NODE_RED_ENTRY: /tmp/gtm-node-red/node_modules/node-red/red.js
        run: node scripts/qa-local-seo-flows.mjs

  social-zenml:
    name: Social · Real ZenML runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned optional runtime
        run: pip install -r integrations/social-zenml/requirements.txt
      - name: Execute all eight pipelines and inspect secret isolation
        run: python integrations/social-zenml/smoke.py
      - name: Build isolated optional worker image
        run: docker build -t gtm-social-zenml-ci integrations/social-zenml

  pap-browser:
    name: PAP · Consent and revocation EN/FR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: Exercise consent defaults and disconnect at mobile and desktop widths
        run: node scripts/qa-poppy.mjs
        env:
          PAP_QA_OUTPUT_DIR: qa-poppy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pap-browser-evidence
          path: qa-poppy
          retention-days: 14

  billing-browser:
    name: Mollie · Offline subscription UX EN/FR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: node scripts/qa-billing.mjs
        env:
          BILLING_QA_OUTPUT_DIR: qa-billing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-browser-evidence
          path: qa-billing
          retention-days: 14
