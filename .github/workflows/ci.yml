name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install · Typecheck · Lint · Test · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Documentation links
        run: npm run docs:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI help (smoke)
        run: node dist/cli.js help

      - name: CLI smoke — GEO engine
        run: node scripts/smoke-geo.mjs

      - name: Landing site check
        run: node scripts/check-site.mjs

      - name: Build production image
        run: docker build -t gtm-growth-ci .

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  landing-visual-qa:
    name: Landing · FR/EN browser QA and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Check French and English journeys
        env:
          LANDING_QA_OUTPUT_DIR: qa-landing
        run: node scripts/qa-landing.mjs

      - name: Google Business Profile dashboard QA
        env:
          LANDING_QA_OUTPUT_DIR: qa-landing
        run: node scripts/qa-gbp-dashboard.mjs

      - name: Social console browser QA
        env:
          SOCIAL_QA_OUTPUT_DIR: qa-landing/social
        run: node scripts/qa-social.mjs

      - name: CRM console and global journey browser QA
        env:
          CRM_QA_OUTPUT_DIR: qa-landing/crm
        run: node scripts/qa-crm.mjs

      - name: Upload bilingual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-fr-en-screenshots
          path: qa-landing/
          if-no-files-found: warn
          retention-days: 14

      - name: Check data assistant in French and English
        env:
          DATA_AGENT_QA_OUTPUT_DIR: qa-data-agent
        run: node scripts/qa-data-agent.mjs

      - name: Upload data assistant screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-agent-fr-en-screenshots
          path: qa-data-agent/
          if-no-files-found: warn
          retention-days: 14

  brand-browser:
    name: Brand · Keycloak 26.4 and dashboard FR/EN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/qa-brand.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-fr-en-screenshots
          path: qa-brand/
          retention-days: 14

  local-seo-flows:
    name: Local SEO · Node-RED runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned optional runtime
        run: npm install --prefix /tmp/gtm-node-red --ignore-scripts --no-audit --no-fund node-red@4.1.17
      - name: Execute exported pollers against a local fixture
        env:
          NODE_RED_ENTRY: /tmp/gtm-node-red/node_modules/node-red/red.js
        run: node scripts/qa-local-seo-flows.mjs

  social-zenml:
    name: Social · Real ZenML runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned optional runtime
        run: pip install -r integrations/social-zenml/requirements.txt
      - name: Execute all eight pipelines and inspect secret isolation
        run: python integrations/social-zenml/smoke.py
      - name: Build isolated optional worker image
        run: docker build -t gtm-social-zenml-ci integrations/social-zenml

  pap-browser:
    name: PAP · Consent and revocation EN/FR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Exercise consent defaults and disconnect at mobile and desktop widths
        run: node scripts/qa-poppy.mjs
        env:
          PAP_QA_OUTPUT_DIR: qa-poppy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pap-browser-evidence
          path: qa-poppy
          retention-days: 14

  billing-browser:
    name: Mollie · Offline subscription UX EN/FR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/qa-billing.mjs
        env:
          BILLING_QA_OUTPUT_DIR: qa-billing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: billing-browser-evidence
          path: qa-billing
          retention-days: 14
