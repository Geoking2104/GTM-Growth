name: Deploy GTM Growth to KayrosLab VPS

# The VPS is shared with OpenDPE and KayrosLab. GTM Growth stays isolated in
# /opt/gtm-growth and binds only to 127.0.0.1:4300; Nginx is the public edge.
# Required repository secrets: VPS_SSH_USER, VPS_SSH_KEY, VPS_SSH_FINGERPRINT.
# Configure required reviewers on the GitHub `production` environment before enabling.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to confirm the production VPS release'
        required: true
        type: string

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require pinned VPS SSH host fingerprint
        env:
          HOST_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          if [ -z "$HOST_FINGERPRINT" ]; then
            echo 'Missing VPS_SSH_FINGERPRINT; refusing unverified SSH connection.' >&2
            exit 1
          fi
      - name: Deploy through the shared OVH VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 51.210.9.71
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          port: 22
          command_timeout: 30m
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/gtm-growth
            cd /opt/gtm-growth
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Refusing to deploy: tracked local changes exist on the VPS." >&2
              exit 1
            fi
            git fetch origin main
            git merge --ff-only origin/main
            bash deploy/kayroslab-vps/deploy.sh
