name: Data agent
on:
  pull_request:
    paths: ['integrations/eve-data-agent/**', '.github/workflows/data-agent.yml']
  push:
    branches: [main]
    paths: ['integrations/eve-data-agent/**', '.github/workflows/data-agent.yml']
permissions:
  contents: read
jobs:
  eve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/eve-data-agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: integrations/eve-data-agent/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: integrations/eve-data-agent/pnpm-lock.yaml
      - name: Install LZMA native build headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblzma-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
