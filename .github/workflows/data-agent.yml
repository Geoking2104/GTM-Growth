name: Data agent
on:
  pull_request:
    paths: ['integrations/eve-data-agent/**', '.github/workflows/data-agent.yml']
  push:
    branches: [main]
    paths: ['integrations/eve-data-agent/**', '.github/workflows/data-agent.yml']
permissions:
  contents: read
jobs:
  eve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/eve-data-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: integrations/eve-data-agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
