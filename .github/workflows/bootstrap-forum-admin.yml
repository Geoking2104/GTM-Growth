name: Activate the first local forum administrator
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: production-gtmgrowth-forum
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create or verify the first local administrator
        env:
          FORUM_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          FORUM_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          FORUM_BOOTSTRAP_PASSWORD: ${{ secrets.FORUM_BOOTSTRAP_PASSWORD }}
        run: bash deploy/kayroslab-vps/forum/transfer.sh local-admin
      - name: Verify the public login page
        run: |
          set -euo pipefail
          host=https://forum.gtmgrowth.kayroslab.com
          test "$(curl -fsS --max-time 15 --retry 2 "$host/srv/status")" = ok
          page=$(curl -fsSL --max-time 20 --retry 2 "$host/login")
          test -n "$page"
          if grep -Eqi 'Failed to automatically register|Congratulations, you installed Discourse' <<< "$page"; then exit 1; fi
