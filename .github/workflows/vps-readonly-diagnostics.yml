name: VPS read-only diagnostics

# Manual only. Never reuse the deploy workflow to diagnose production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-readonly-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect OVH VPS without changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require existing SSH credentials and pinned host identity
        env:
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        shell: bash
        run: |
          if [[ -z "$SSH_USER" || -z "$SSH_KEY" || -z "$SSH_FINGERPRINT" ]]; then
            echo 'Missing VPS_SSH_USER, VPS_SSH_KEY or VPS_SSH_FINGERPRINT repository secret.' >&2
            exit 1
          fi

      - name: Collect safe system and Docker diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 51.210.9.71
          port: 22
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          command_timeout: 2m
          script: |
            set -eu
            echo '=== System ==='
            hostname
            uname -r
            uptime
            echo '=== Effective SSH identity ==='
            id -un
            id -u
            id -nG
            if sudo -n true 2>/dev/null; then
              echo 'passwordless_sudo=yes'
            else
              echo 'passwordless_sudo=no'
            fi
            echo '=== Capacity ==='
            nproc
            free -h
            df -h /
            echo '=== Container runtime ==='
            if command -v docker >/dev/null 2>&1; then
              docker --version
              docker compose version || true
              docker info --format 'Security options: {{json .SecurityOptions}}' || true
              docker ps --format 'table {{.Names}}\t{{.Status}}' || true
            else
              echo 'Docker command unavailable for this user.'
            fi
            echo '=== End of read-only diagnostics ==='
